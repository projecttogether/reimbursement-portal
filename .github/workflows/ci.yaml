name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets in the history
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The CLI needs no license key or provider credentials.
      - name: Install the pinned Gitleaks CLI
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      # Every commit of the history, merge commits too, without showing what matched
      # (.gitleaksignore lists reviewed findings).
      - name: Scan the history
        run: '"${{ runner.temp }}/gitleaks" git . --log-opts="--diff-merges=first-parent HEAD" --redact=100 --no-banner'

  checks:
    name: Checks and production image
    # The document sandbox tests require Linux with Landlock ABI 3 or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: compose.ci.yaml
      COMPOSE_PROJECT_NAME: reimbursement-portal-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public repository contents
        run: python3 scripts/check_public_repository.py

      - name: Check signature lifecycle
        run: node --test tests/js/*.test.cjs

      - name: Build test image
        run: docker compose --env-file /dev/null build checks

      - name: Run lint, Django checks, and PostgreSQL tests
        run: docker compose --env-file /dev/null run --rm --no-TTY checks

      - name: Build production image and stylesheet
        run: docker build --target runtime --tag reimbursements:ci .

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file /dev/null logs --no-color

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose --env-file /dev/null down --volumes --remove-orphans

  browser:
    name: Browser and setup checks
    # The production image's document sandbox requires Linux with Landlock ABI 3 or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: compose.ci.yaml
      COMPOSE_PROJECT_NAME: reimbursement-portal-browser-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Playwright and Chromium
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build production image
        run: docker compose --env-file /dev/null build web

      - name: Migrate and create the demo form
        run: |
          docker compose --env-file /dev/null run --rm --no-TTY web python manage.py migrate --noinput
          docker compose --env-file /dev/null run --rm --no-TTY web python manage.py seed_demo

      - name: Start web and worker
        run: docker compose --env-file /dev/null up --detach --wait web worker

      - name: Run participant smoke test
        env:
          BASE_URL: http://127.0.0.1:8000
          OUTPUT_DIR: ${{ runner.temp }}/browser
        run: node tests/browser/smoke.cjs

      - name: Run setup check
        run: >-
          docker compose --env-file /dev/null exec --no-TTY web
          python manage.py verify_setup --to finance@example.invalid

      - name: Keep screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/browser/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file /dev/null logs --no-color

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose --env-file /dev/null down --volumes --remove-orphans
