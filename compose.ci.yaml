services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reimbursement
      POSTGRES_USER: reimbursement
      POSTGRES_PASSWORD: local-ci-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reimbursement -d reimbursement"]
      interval: 1s
      timeout: 5s
      retries: 20

  checks:
    build:
      context: .
      target: test
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgresql://reimbursement:local-ci-only@database:5432/reimbursement
      MAIL_DELIVERY_MODE: local
      UPLOAD_SCANNER: disabled
    depends_on:
      database:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        ruff check .
        ruff format --check .
        python manage.py check
        python manage.py makemigrations --check --dry-run
        pytest -q
