# Deploy this as a separate Git-based Coolify resource for each public domain.
# The shared backend owns migrations, ClamAV, worker and webhook.
# Enable Connect To Predefined Network to reach the separate PostgreSQL resource.
services:
  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 512m
    expose:
      - "8000"
    environment:
      DJANGO_DEBUG: "0"
      PORTAL_ROLE: web
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Use the shared backend secret}
      DATABASE_URL: ${DATABASE_URL:?Use the separate PostgreSQL resource internal URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Include only this public hostname and 127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set this web service HTTPS origin}
      PRIVATE_STORAGE_ROOT: /app/var/private
      TRUST_PROXY_HEADERS: "1"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set the trusted reverse proxy network CIDRs}
      DOCUMENT_SANDBOX_ENABLED: "1"
      REQUIRE_WORKER_HEARTBEAT: "1"
      HEALTHCHECK_TOKEN: ${HEALTHCHECK_TOKEN:?Set a health check token}
      MAIL_DELIVERY_MODE: mailersend
      APPROVED_DELIVERY_RECIPIENTS: ${APPROVED_DELIVERY_RECIPIENTS:?Use inboxes approved by the shared worker}
      TEST_RECIPIENT_ALLOWLIST: ${TEST_RECIPIENT_ALLOWLIST:-}
      UPLOAD_SCANNER: clamav
      CLAMAV_HOST: ${CLAMAV_HOST:-pt-reimbursement-scanner}
      CLAMAV_PORT: "3310"
      MAX_ACTIVE_DRAFTS: ${MAX_ACTIVE_DRAFTS:-1000}
      TOTAL_WEB_WORKERS: ${TOTAL_WEB_WORKERS:-4}
      MAX_DRAFTS_PER_NETWORK: ${MAX_DRAFTS_PER_NETWORK:-300}
      MAX_UPLOADS_PER_NETWORK: ${MAX_UPLOADS_PER_NETWORK:-60000}
      MAX_UPLOADS_PER_NETWORK_PER_MINUTE: ${MAX_UPLOADS_PER_NETWORK_PER_MINUTE:-3000}
      MAX_UPLOAD_BYTES_PER_NETWORK: ${MAX_UPLOAD_BYTES_PER_NETWORK:-45000000000}
      MAX_PENDING_VALIDATIONS: ${MAX_PENDING_VALIDATIONS:-1000}
      MAX_JOB_AGE_SECONDS: ${MAX_JOB_AGE_SECONDS:-900}
      MAX_FINAL_PDF_BYTES: ${MAX_FINAL_PDF_BYTES:-10000000}
      MIN_FREE_STORAGE_BYTES: ${MIN_FREE_STORAGE_BYTES:-1000000000}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-240}
      EVENT_SLUG: ${EVENT_SLUG:?Set a unique event slug for this web service}
      EVENT_NAME: ${EVENT_NAME:?Set the event name}
      EVENT_COST_CENTER: ${EVENT_COST_CENTER:?Set the approved Kostenstelle}
      EVENT_COST_OBJECT: ${EVENT_COST_OBJECT:-}
      EVENT_RECIPIENT: ${EVENT_RECIPIENT:?Set the approved Moss or Finance inbox}
      EVENT_SUPPORT_EMAIL: ${EVENT_SUPPORT_EMAIL:?Set the event Finance contact}
      EVENT_PRIVACY_NOTICE: ${EVENT_PRIVACY_NOTICE:?Set the approved privacy notice}
      EVENT_PRIVACY_VERSION: ${EVENT_PRIVACY_VERSION:?Set the privacy notice version}
      EVENT_FINANCE_NOTE: ${EVENT_FINANCE_NOTE:-}
      EVENT_INSTRUCTIONS: ${EVENT_INSTRUCTIONS:-}
      EVENT_ALLOWED_CURRENCIES: ${EVENT_ALLOWED_CURRENCIES:-EUR}
      EVENT_TRAVEL_REQUIRED: ${EVENT_TRAVEL_REQUIRED:-1}
      EVENT_ACTIVE: ${EVENT_ACTIVE:-0}
      EVENT_TRIP_START: ${EVENT_TRIP_START:-}
      EVENT_TRIP_END: ${EVENT_TRIP_END:-}
      EVENT_OPENS_AT: ${EVENT_OPENS_AT:-}
      EVENT_CLOSES_AT: ${EVENT_CLOSES_AT:-}
    volumes:
      - private_data:/app/var/private
    tmpfs:
      - /app/var/private/work:size=700m,mode=0700,uid=10001,gid=10001
    networks:
      - shared
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/-/readyz',headers={'X-Health-Token':os.environ['HEALTHCHECK_TOKEN'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      start_period: 60s
      timeout: 5s
      retries: 3

volumes:
  private_data:
    external: true
    name: ${PRIVATE_DATA_VOLUME:-pt-reimbursement-private}

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK:-pt-reimbursement-shared}
